[project]
name = "onology-meds"
version = "0.1.0"
description = "MEDS + DILI pipeline for onology baseline data"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4",
  "numpy>=2.2",
  "pandas>=2.2",
]

[project.scripts]
onology-meds = "onology_meds.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
